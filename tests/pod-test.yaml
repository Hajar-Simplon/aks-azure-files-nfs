apiVersion: v1
kind: Pod
metadata:
  name: azurefiles-nfs-test
  namespace: mongodb
spec:
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: azurefiles
          mountPath: /mnt/azure
  volumes:
    - name: azurefiles
      persistentVolumeClaim:
        claimName: azurefiles-nfs-test
  restartPolicy: Never
